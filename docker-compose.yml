services:
  whatsoup:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      WHATSOUP_MODE: supervisor
      WHATSOUP_DOCKER: "1"
      FLEET_PORT: "9099"
      FLEET_BIND_ADDRESS: "0.0.0.0"
      # Required with a non-loopback bind: the console HTML serves the root
      # fleet token unauthenticated (B1). Acceptable here because the port is
      # only exposed through the compose-level port mapping you configure.
      WHATSOUP_FLEET_UNSAFE_REMOTE_CONSOLE: "1"
      HEALTH_BIND_ADDRESS: "0.0.0.0"
      WHATSOUP_INSTANCES: ${WHATSOUP_INSTANCES:-}
      WHATSOUP_HEALTH_TOKEN: ${WHATSOUP_HEALTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${FLEET_PORT:-9099}:${FLEET_PORT:-9099}"
      # Expose instance health ports as needed, e.g.:
      # - "9090:9090"
      # - "9091:9091"
    volumes:
      - config:/home/whatsoup/.config/whatsoup
      - data:/home/whatsoup/.local/share/whatsoup
      - state:/home/whatsoup/.local/state/whatsoup
    healthcheck:
      # Hit the SPA shell (static, no auth) — /api/* requires a fleet token.
      test: ["CMD", "node", "-e",
        "fetch('http://127.0.0.1:${FLEET_PORT:-9099}/').then(r=>{if(!r.ok)throw r.status}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Auth helper — run with: docker compose run --rm auth
  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      WHATSOUP_MODE: auth
      WHATSOUP_DOCKER: "1"
      WHATSOUP_INSTANCE: ${AUTH_INSTANCE:-}
    volumes:
      - config:/home/whatsoup/.config/whatsoup
      - data:/home/whatsoup/.local/share/whatsoup
      - state:/home/whatsoup/.local/state/whatsoup
    profiles:
      - auth
    restart: "no"

volumes:
  config:
  data:
  state:
