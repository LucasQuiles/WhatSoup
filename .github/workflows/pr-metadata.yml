name: PR metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # This workflow must report its required context on the merge-queue ref.
  # The queue event has no PR body payload, so the body/commit metadata guard
  # remains a pull_request-only check completed before queue entry.
  merge_group:

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  metadata:
    name: pr metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The guard and its transitive imports use the immutable base revision;
      # candidate content remains Git data only. The pull_request workflow
      # definition itself requires separate hosted qualification.
      - name: Checkout trusted metadata base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Fetch PR head history
        if: github.event_name == 'pull_request'
        env:
          PR_METADATA_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_METADATA_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/${PR_METADATA_NUMBER}/head"
          test "$(git rev-parse --verify FETCH_HEAD^{commit})" = "$PR_METADATA_HEAD"

      - name: PR metadata guard
        if: github.event_name == 'pull_request'
        env:
          PR_METADATA_EVENT: ${{ github.event_path }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/pr-metadata-guard.ts --github-event "$PR_METADATA_EVENT" --json
