name: PR metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # This workflow must report its required context on the merge-queue ref.
  # The queue event has no PR body payload, so the body/commit metadata guard
  # remains a pull_request-only check completed before queue entry.
  merge_group:

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  metadata:
    name: pr metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: PR metadata guard
        if: github.event_name == 'pull_request'
        env:
          PR_METADATA_EVENT: ${{ github.event_path }}
        run: npm run guard:pr-metadata -- --github-event "$PR_METADATA_EVENT" --json
