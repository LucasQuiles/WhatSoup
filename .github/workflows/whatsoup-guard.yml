name: whatsoup-guard

on:
  pull_request:
    paths: ['tools/whatsoup_guard/**', '.github/workflows/whatsoup-guard.yml']
  push:
    branches: [main]
    paths: ['tools/whatsoup_guard/**', '.github/workflows/whatsoup-guard.yml']

permissions:
  contents: read

# Superseded runs on the same ref are safe to drop (PR/push guard, like quality.yml
# — the opposite of tag-release-gate.yml, which never interrupts a release).
concurrency:
  group: whatsoup-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x', '25.x']
    defaults:
      run:
        working-directory: tools/whatsoup_guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/whatsoup_guard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
