name: Private boundary text

# The hosted text check: issue text, comments, reviews and review comments against the private
# term list, which only this job holds (environment secret WHATSOUP_PRIVATE_TERMS_JSON).
#
# - issues and issue_comment run this file from the default branch with the secret, also for an
#   outside contributor; the item comes from the event payload file.
# - pull_request_review and pull_request_review_comment are not triggers: GitHub runs them from
#   the pull request's merge commit, with that commit's copy of this file, and without secrets
#   for a fork. The hourly run lists every review and review comment instead, together with
#   every issue, pull request and comment changed since the last successful hourly run.
# - A finding fails the run and prints the item kind and number with counts by rule code. The
#   run never edits, hides, labels or comments on anything.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '17 * * * *'

permissions: {}

jobs:
  scan:
    if: github.repository == 'LucasQuiles/WhatSoup'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: private-scanner-trusted
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Create the owned scratch folder
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$RUNNER_TEMP/boundary-private-text"
          test ! -e "$scratch"
          mkdir -m 700 -- "$scratch" "$scratch/trusted"

      # These events run on the default-branch revision; no checkout is used.
      - name: Read exact trusted scanner files
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_FILES: |
            scripts/boundary-private-scan.ts
            scripts/lib/ci-control/exact-range-provenance.ts
            scripts/lib/ci-control/git-blob-input.ts
            scripts/lib/ci-control/git-input-core.ts
            scripts/lib/ci-control/git-input.ts
            scripts/lib/ci-control/input-limits.ts
            scripts/lib/ci-control/trusted-git.ts
            scripts/lib/cli-args.ts
            scripts/lib/guard-core.ts
            scripts/lib/private-terms.ts
            scripts/lib/repo-hygiene-boundary.ts
            scripts/lib/repo-hygiene-policy.ts
            scripts/lib/verification/boundary-run/contracts.ts
            scripts/lib/verification/boundary-run/model.ts
            scripts/lib/verification/boundary-run/schema.ts
            scripts/lib/verification/boundary-run/shared.ts
            scripts/lib/verification/boundary-run/worktree.ts
            scripts/repo-hygiene-guard.ts
            src/lib/git-env.ts
            src/lib/type-guards.ts
        run: |
          set -euo pipefail
          umask 077
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          curl_version="$(curl --version | awk 'NR == 1 { print $2; exit }')"
          [[ "$curl_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS=. read -r curl_major curl_minor _curl_patch <<< "$curl_version"
          if ! (( curl_major > 8 || (curl_major == 8 && curl_minor >= 4) )); then
            echo "boundary text: curl 8.4.0 or newer is required for bounded trusted-file downloads"
            exit 2
          fi
          trusted="$RUNNER_TEMP/boundary-private-text/trusted"
          count=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [[ "$file" =~ ^(scripts|src)/[A-Za-z0-9/._-]+\.ts$ ]]
            [[ "$file" != *..* ]]
            mkdir -p -- "$trusted/$(dirname -- "$file")"
            status="$(curl --silent --fail --proto '=https' --connect-timeout 5 --max-time 30 \
              --max-filesize 1048576 --header 'Accept: application/vnd.github.raw+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --output "$trusted/$file" --write-out '%{http_code}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$file?ref=$TRUSTED_SHA")"
            test "$status" = 200
            test -s "$trusted/$file"
            count=$((count + 1))
          done <<< "$TRUSTED_FILES"
          test "$count" -gt 0
          printf '{"type":"module"}\n' > "$trusted/package.json"

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.x'

      - name: Collect the changed text
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/boundary-private-text"
          env -i PATH="$PATH" HOME="$scratch" LANG=C LC_ALL=C \
            GITHUB_TOKEN="$GITHUB_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_API_URL="$GITHUB_API_URL" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            node "$scratch/trusted/scripts/boundary-private-scan.ts" collect-text --out "$scratch"

      - name: Write the private term file
        shell: bash
        env:
          WHATSOUP_PRIVATE_TERMS_JSON: ${{ secrets.WHATSOUP_PRIVATE_TERMS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${WHATSOUP_PRIVATE_TERMS_JSON:-}" ]; then
            echo "boundary text: the private term secret is missing or empty; the check fails closed"
            exit 1
          fi
          umask 077
          terms_file="$RUNNER_TEMP/private-terms.json"
          test ! -e "$terms_file"
          printf '%s' "$WHATSOUP_PRIVATE_TERMS_JSON" > "$terms_file"
          chmod 600 "$terms_file"
          test -n "$(find "$terms_file" -maxdepth 0 -type f -perm 600)"

      - name: Scan the text
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/boundary-private-text"
          env -i PATH="$PATH" HOME="$scratch" LANG=C LC_ALL=C \
            WHATSOUP_PRIVATE_TERMS_FILE="$RUNNER_TEMP/private-terms.json" WHATSOUP_REQUIRE_PRIVATE_TERMS=1 \
            node "$scratch/trusted/scripts/boundary-private-scan.ts" scan-text --out "$scratch"

      - name: Remove the private term file
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/private-terms.json"
          test ! -e "$RUNNER_TEMP/private-terms.json"
