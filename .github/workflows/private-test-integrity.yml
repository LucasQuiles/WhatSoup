name: Private test integrity

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions: {}

jobs:
  private-scanner:
    if: >-
      github.repository == 'LucasQuiles/WhatSoup' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.event == 'pull_request' ||
        (github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))) ||
        (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: private-scanner-trusted
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Create owned scanner scratch
        id: scratch
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scanner_root="$(mktemp -d "$GITHUB_WORKSPACE/.private-scanner.XXXXXXXX")"
          test "$(realpath "$scanner_root")" = "$scanner_root"
          printf 'root=%s\n' "$scanner_root" >> "$GITHUB_OUTPUT"
          printf 'checkout=%s/private-checkout\n' "${scanner_root#"$GITHUB_WORKSPACE"/}" >> "$GITHUB_OUTPUT"
          sudo -n mount -t tmpfs -o "size=512m,nr_inodes=16384,nodev,nosuid,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$scanner_root"
          test "$(stat -f --format=%T "$scanner_root")" = tmpfs
          python3 -I -S -B - "$scanner_root" <<'PY'
          import errno
          import os
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          filesystem = os.statvfs(root)
          limit = 512 * 1024 * 1024
          if not 0 < filesystem.f_blocks * filesystem.f_frsize <= limit or not 0 < filesystem.f_files <= 16384:
              raise SystemExit("scanner filesystem budget is unavailable")
          probe = root / ".budget-probe"
          chunk = bytes(1024 * 1024)
          written = 0
          try:
              with probe.open("xb", buffering=0) as output:
                  try:
                      while written <= limit:
                          written += output.write(chunk)
                  except OSError as error:
                      if error.errno != errno.ENOSPC:
                          raise
                  else:
                      raise SystemExit("scanner filesystem accepted an over-budget write")
          finally:
              probe.unlink()
          with probe.open("xb") as output:
              output.write(chunk)
          try:
              if probe.read_bytes() != chunk:
                  raise SystemExit("scanner filesystem did not recover after quota rejection")
          finally:
              probe.unlink()
          print("scanner scratch: 512 MiB and 16384 inodes; over-budget write rejected; recovery passed")
          PY

      # workflow_run supplies the default-branch revision; no candidate checkout is used.
      - name: Read exact trusted driver files
        id: trusted-driver
        timeout-minutes: 6
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
          SCANNER_ROOT: ${{ steps.scratch.outputs.root }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          curl_version="$(curl --version | awk 'NR == 1 { print $2; exit }')"
          [[ "$curl_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS=. read -r curl_major curl_minor _curl_patch <<< "$curl_version"
          if ! (( curl_major > 8 || (curl_major == 8 && curl_minor >= 4) )); then
            printf 'curl 8.4.0 or newer is required for bounded trusted-driver downloads\n' >&2
            exit 2
          fi
          mkdir "$SCANNER_ROOT/driver"
          for file in bounded_github.py candidate_scan.py github_binding.py private_bundle.py \
            private_check.py private_git.py private_scanner_candidate.py run_workflow.py \
            runtime_capture.py scanner_runtime.py scanner_grammars.py; do
            status="$(curl --silent --fail --proto '=https' --connect-timeout 5 --max-time 30 \
              --max-filesize 1048576 --header 'Accept: application/vnd.github.raw+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --output "$SCANNER_ROOT/driver/$file" --write-out '%{http_code}' \
              "https://api.github.com/repos/LucasQuiles/WhatSoup/contents/tools/private-test-integrity/$file?ref=$TRUSTED_SHA")"
            test "$status" = 200
            test -s "$SCANNER_ROOT/driver/$file"
          done
          status="$(curl --silent --fail --proto '=https' --connect-timeout 5 --max-time 30 \
            --max-filesize 16384 --header 'Accept: application/vnd.github.raw+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --output "$SCANNER_ROOT/resolve-timeout-bin.sh" --write-out '%{http_code}' \
            "https://api.github.com/repos/LucasQuiles/WhatSoup/contents/scripts/resolve-timeout-bin.sh?ref=$TRUSTED_SHA")"
          test "$status" = 200
          test -s "$SCANNER_ROOT/resolve-timeout-bin.sh"

      - name: Prepare pinned native grammar cache
        id: grammars
        timeout-minutes: 3
        shell: bash
        env:
          SCANNER_ROOT: ${{ steps.scratch.outputs.root }}
        run: |
          set -euo pipefail
          archive="$SCANNER_ROOT/parsers-linux-x86_64.tar.zst"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 90 --max-filesize 19134009 --output "$archive" \
            'https://github.com/xberg-io/tree-sitter-language-pack/releases/download/v1.6.2/parsers-linux-x86_64.tar.zst'
          python3.12 -I -S -B "$SCANNER_ROOT/driver/scanner_grammars.py" "$archive" "$SCANNER_ROOT/grammar-cache"
          rm -- "$archive"

      - name: Acquire pinned private scanner over SSH
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: LucasQuiles/test-integrity
          ref: ea0b01a4e3d99dc58a9a475c57e22ee204b04a7c
          path: ${{ steps.scratch.outputs.checkout }}
          # An absent secret must fail SSH authentication, never select an HTTPS remote.
          ssh-key: ${{ secrets.TEST_INTEGRITY_DEPLOY_KEY || 'missing-private-scanner-key' }}
          ssh-strict: true
          persist-credentials: false
          set-safe-directory: false
          clean: false
          fetch-depth: 1
          show-progress: false
          submodules: false
          lfs: false

      - name: Qualify runtime and scan exact pull request data
        id: scan
        timeout-minutes: 22
        shell: bash
        env:
          SCANNER_ROOT: ${{ steps.scratch.outputs.root }}
          QUALITY_RUN_ID: ${{ github.event.workflow_run.id }}
          QUALITY_EVENT: ${{ github.event.workflow_run.event }}
          QUALITY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          QUALITY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python_bin="$(realpath "$(command -v python3.12)")"
          bash_bin="$(realpath /bin/bash)"
          git_bin="$(realpath "$(command -v git)")"
          trusted_path="$(dirname "$python_bin"):/usr/bin:/bin"
          timeout_bin="$(PATH="$trusted_path" "$bash_bin" "$SCANNER_ROOT/resolve-timeout-bin.sh")"
          python_sha="$(sha256sum "$python_bin" | cut -d ' ' -f 1)"
          bash_sha="$(sha256sum "$bash_bin" | cut -d ' ' -f 1)"
          git_sha="$(sha256sum "$git_bin" | cut -d ' ' -f 1)"
          RECEIPT_PATH=''
          receipt_args=()
          if [[ "$QUALITY_EVENT" != 'pull_request' ]]; then
            receipt_dir="$RUNNER_TEMP/private-integrity"
            RECEIPT_PATH="$SCANNER_ROOT/receipt.json"
            test ! -e "$receipt_dir"
            mkdir -m 700 -- "$receipt_dir"
            test "$(realpath "$receipt_dir")" = "$receipt_dir"
            receipt_args=(--receipt "$RECEIPT_PATH")
          fi
          cd "$SCANNER_ROOT"
          set +e
          env -i PATH="$trusted_path" LANG=C LC_ALL=C TMPDIR="$SCANNER_ROOT" GITHUB_TOKEN="$GITHUB_TOKEN" \
            QUALITY_RUN_ID="$QUALITY_RUN_ID" QUALITY_EVENT="$QUALITY_EVENT" QUALITY_RUN_ATTEMPT="$QUALITY_RUN_ATTEMPT" QUALITY_HEAD_SHA="$QUALITY_HEAD_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" RECEIPT_PATH="$RECEIPT_PATH" \
            "$timeout_bin" --signal=TERM --kill-after=30s 20m \
            "$python_bin" -I -S -B "$SCANNER_ROOT/driver/run_workflow.py" \
            --run-id "$QUALITY_RUN_ID" --private-checkout "$SCANNER_ROOT/private-checkout" \
            --git "$git_bin" --git-sha256 "$git_sha" \
            --python "$python_bin" --python-sha256 "$python_sha" \
            --bash "$bash_bin" --bash-sha256 "$bash_sha" --trusted-path "$trusted_path" "${receipt_args[@]}" >/dev/null 2>&1
          scanner_exit="$?"
          set -e
          case "$scanner_exit" in
            0|1|2) ;;
            *) scanner_exit=2 ;;
          esac
          if [[ "$QUALITY_EVENT" != 'pull_request' ]]; then
            test -s "$RECEIPT_PATH"
            test ! -e "$RUNNER_TEMP/private-integrity/receipt.json"
            mv -- "$RECEIPT_PATH" "$RUNNER_TEMP/private-integrity/receipt.json"
            test -f "$RUNNER_TEMP/private-integrity/receipt.json"
            chmod 600 "$RUNNER_TEMP/private-integrity/receipt.json"
          fi
          printf 'scanner-exit=%s\n' "$scanner_exit" >> "$GITHUB_OUTPUT"

      - name: Remove owned scanner scratch
        id: cleanup
        if: always()
        shell: bash
        env:
          SCANNER_ROOT: ${{ steps.scratch.outputs.root }}
        run: |
          set -euo pipefail
          if [[ -z "$SCANNER_ROOT" ]]; then exit 0; fi
          [[ "$SCANNER_ROOT" == "$GITHUB_WORKSPACE"/.private-scanner.* ]]
          test "$(dirname "$SCANNER_ROOT")" = "$GITHUB_WORKSPACE"
          test "$(realpath "$SCANNER_ROOT")" = "$SCANNER_ROOT"
          if mountpoint -q -- "$SCANNER_ROOT"; then
            sudo -n umount -- "$SCANNER_ROOT"
          fi
          rmdir -- "$SCANNER_ROOT"
          test ! -e "$SCANNER_ROOT"

      - name: Upload private integrity receipt
        if: always() && github.event.workflow_run.event != 'pull_request' && steps.cleanup.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: private-integrity-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/private-integrity/receipt.json
          if-no-files-found: error
          # A retry replaces only this run's receipt; consumers recheck the producer attempt.
          overwrite: true
          retention-days: 30

      - name: Enforce private scanner conclusion
        if: always()
        shell: bash
        env:
          SCANNER_EXIT: ${{ steps.scan.outputs.scanner-exit }}
        run: |
          case "$SCANNER_EXIT" in
            0|1|2) exit "$SCANNER_EXIT" ;;
            *) exit 2 ;;
          esac
