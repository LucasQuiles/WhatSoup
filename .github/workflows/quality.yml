name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # `quality (24.x)` / `quality (25.x)` are REQUIRED contexts on main. A merge queue
  # only advances once every required check reports on the merge_group ref, so without
  # this trigger an enabled queue would stall every PR indefinitely waiting for a run
  # that never starts. Wire the trigger BEFORE enabling the queue, never after.
  merge_group:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # A scheduled run must never inherit a stale changed-file classification.
  # selection below forces the complete profile for all non-PR events.
  schedule:
    - cron: '23 6 * * *'

# Cancel superseded runs for the same ref. A new push/PR-sync supersedes the
# in-flight run instead of leaving it orphaned at "pending 0s" for hours (the
# close+reopen-to-retrigger workaround) and frees a runner slot immediately.
# merge_group and tag refs are deliberately EXEMPT: cancelling either can report a
# failed/cancelled required check. Both must always finish.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  selection:
    name: Quality selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      profile: ${{ steps.plan.outputs.profile }}
      lanes: ${{ steps.plan.outputs.lanes }}
      reasons: ${{ steps.plan.outputs.reasons }}
      changed-files: ${{ steps.plan.outputs.changed-files }}
      test-base: ${{ steps.plan.outputs.test-base }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Select Quality profile before dependency installation
        id: plan
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';

          const laneNames = ['root', 'console', 'browser', 'python', 'guard', 'docker', 'compatibility'];
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', timeout: 10000, maxBuffer: 4 * 1024 * 1024 }).trimEnd();
          const isPr = process.env.GITHUB_EVENT_NAME === 'pull_request';
          const base = isPr ? process.env.TEST_BASE : null;
          if (isPr && !/^[0-9a-f]{40}$/.test(base ?? '')) throw new Error('An immutable PR base is required');
          const changedFiles = isPr ? git('diff', '--no-renames', '--name-only', '-z', `${base}...HEAD`, '--').split('\0').filter(Boolean) : [];
          // Candidate selection code cannot approve changes to itself or its transitive inputs.
          const controlsChanged = changedFiles.some((file) => /^(?:scripts\/|\.github\/|deploy\/|src\/lib\/(?:git-env|type-guards)\.ts$|package(?:-lock)?\.json$|\.nvmrc$|\.npmrc$)/.test(file));
          const plan = !isPr || controlsChanged ? {
            profile: 'full', lanes: Object.fromEntries(laneNames.map((lane) => [lane, true])),
            changedFiles, base, reasons: [controlsChanged ? 'Selection controls changed; full validation required' : 'Non-PR event requires full validation'],
          } : JSON.parse(execFileSync(process.execPath, ['--experimental-strip-types', 'scripts/test-plan.ts', '--base', base, '--json'], {
            encoding: 'utf8', timeout: 60000, maxBuffer: 1024 * 1024,
          }));
          if (
            !['docs', 'affected', 'full'].includes(plan.profile)
            || !Array.isArray(plan.reasons)
            || !Array.isArray(plan.changedFiles)
            || laneNames.some((lane) => typeof plan.lanes?.[lane] !== 'boolean')
          ) throw new Error('test-plan returned an invalid selection');

          const output = process.env.GITHUB_OUTPUT;
          if (!output) throw new Error('GITHUB_OUTPUT is required');
          const values = {
            plan: JSON.stringify(plan),
            profile: plan.profile,
            lanes: JSON.stringify(plan.lanes),
            reasons: JSON.stringify(plan.reasons),
            'changed-files': JSON.stringify(plan.changedFiles),
            'test-base': typeof plan.base === 'string' ? plan.base : '',
          };
          appendFileSync(output, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE

      - name: Summarize Quality selection
        env:
          TEST_PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          TEST_PLAN="$TEST_PLAN" node --input-type=module <<'NODE'
          const plan = JSON.parse(process.env.TEST_PLAN);
          const lanes = Object.entries(plan.lanes).filter(([, selected]) => selected).map(([name]) => name).join(', ') || 'static only';
          console.log(`profile=${plan.profile}`);
          console.log(`lanes=${lanes}`);
          console.log(`reasons=${plan.reasons.join('; ')}`);
          NODE

      - name: Disclosure guards before reduced PR validation
        if: github.event_name == 'pull_request' && steps.plan.outputs.profile != 'full'
        env:
          TEST_BASE: ${{ steps.plan.outputs.test-base }}
        run: |
          test -n "$TEST_BASE"
          node --experimental-strip-types scripts/repo-hygiene-guard.ts --branch-diff --base "$TEST_BASE"
          node --experimental-strip-types scripts/repo-hygiene-guard.ts --commit-authors
          node --experimental-strip-types scripts/publication-guard.ts --all
          node --experimental-strip-types scripts/publication-guard.ts --branch-diff
          node --experimental-strip-types scripts/public-surface-drift-check.ts

  docs:
    name: Quality documentation validation
    needs: selection
    if: needs.selection.outputs.profile == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'

      # Docs profile intentionally installs no application dependencies and never
      # creates a Docker image. It still checks the repository's live doc claims.
      - name: Documentation drift guard
        run: node --experimental-strip-types scripts/doc-drift-check.ts

  affected:
    name: Quality affected (24.x)
    needs: selection
    if: needs.selection.outputs.profile == 'affected'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            console/package-lock.json

      - name: Read exact Node cache key component
        id: affected-typescript-node
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      # Compiler state only: test outputs, coverage, and dependency trees stay uncached.
      - name: Cache TypeScript incremental state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .local/typescript
          key: typescript-${{ runner.os }}-node${{ steps.affected-typescript-node.outputs.version }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'console/package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            typescript-${{ runner.os }}-node${{ steps.affected-typescript-node.outputs.version }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'console/package-lock.json', 'tsconfig*.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Install console dependencies when selected
        if: fromJSON(needs.selection.outputs.lanes).root || fromJSON(needs.selection.outputs.lanes).console
        run: npm --prefix console ci

      - name: Install console design checker dependency when selected
        if: fromJSON(needs.selection.outputs.lanes).console
        timeout-minutes: 3
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ripgrep
          fi
          rg --version

      - name: Install guard tool dependencies when selected
        if: fromJSON(needs.selection.outputs.lanes).guard
        run: npm --prefix tools/whatsoup_guard ci

      - name: Typecheck source when selected
        if: fromJSON(needs.selection.outputs.lanes).root
        run: npm run typecheck

      - name: Typecheck full source surface when selected
        if: fromJSON(needs.selection.outputs.lanes).root
        run: npm run typecheck:all

      - name: Import boundary guard when selected
        if: fromJSON(needs.selection.outputs.lanes).root
        run: npm run guard:boundaries

      - name: Import cycle guard when selected
        if: fromJSON(needs.selection.outputs.lanes).root
        run: npm run guard:import-cycle

      - name: Phantom dependency guard when selected
        if: fromJSON(needs.selection.outputs.lanes).root
        run: npm run guard:phantom-deps

      - name: ESLint fitness ring when selected
        if: fromJSON(needs.selection.outputs.lanes).root
        run: npm run guard:lint:src

      - name: Documentation guards when selected
        if: fromJSON(needs.selection.outputs.lanes).root
        run: |
          npm run guard:doc-drift
          npm run guard:public-surface-drift

      - name: Cache Playwright browsers when selected
        if: fromJSON(needs.selection.outputs.lanes).browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-node24-
            playwright-${{ runner.os }}-

      - name: Install Playwright system deps when selected
        if: fromJSON(needs.selection.outputs.lanes).browser
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Install Playwright browser when selected
        if: fromJSON(needs.selection.outputs.lanes).browser
        run: |
          TIMEOUT_BIN="$(bash scripts/resolve-timeout-bin.sh)"
          for attempt in 1 2 3; do
            echo "::group::Playwright chromium download attempt ${attempt}/3"
            if "$TIMEOUT_BIN" 300 npx playwright install chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            sleep $((attempt * 15))
          done
          echo "Playwright chromium download failed after 3 attempts"
          exit 1

      - name: Run affected Quality suites
        env:
          TEST_BASE: ${{ needs.selection.outputs.test-base }}
        run: npm run test:affected -- --base "$TEST_BASE" --max-workers 2 --timeout-ms 600000

  compatibility-affected:
    name: Quality affected (25.x)
    needs: selection
    if: needs.selection.outputs.profile == 'affected' && fromJSON(needs.selection.outputs.lanes).compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node 25
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '25.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install console dependencies when selected
        if: fromJSON(needs.selection.outputs.lanes).root || fromJSON(needs.selection.outputs.lanes).console
        run: npm --prefix console ci

      - name: Run affected compatibility root suite
        env:
          TEST_BASE: ${{ needs.selection.outputs.test-base }}
        run: npm run test:affected -- --base "$TEST_BASE" --suite root --max-workers 2 --timeout-ms 600000

      - name: Console compatibility build when selected
        if: fromJSON(needs.selection.outputs.lanes).console
        run: npm --prefix console run build

  full:
    name: Quality full (24.x)
    needs: selection
    if: needs.selection.outputs.profile == 'full'
    runs-on: ubuntu-latest
    # Generous cap so it only kills a genuinely hung run, not a slow-but-live
    # one (the authority job runs the full suite + coverage and can take ~40min).
    # Without this a hung run rides to the 6h GitHub default.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      # Measure before mutating. Runners already above the explicit budget skip
      # cleanup; low-space runners reclaim only the helper's allowlisted,
      # unused toolchains and Docker images, then fail closed if still short.
      # Runs before Setup Node so it can never touch the selected node toolcache.
      - name: Enforce CI disk budget
        run: bash scripts/ci-disk-reclaim.sh

      # Node 24 is the full enforcement authority. The explicit compatibility
      # job below validates the supported Node 25 runtime without duplicating
      # version-invariant guards, coverage, Python, design, or browser work.
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          # Include the console sub-package lockfile in the cache key so the warm
          # npm cache also covers `npm --prefix console ci` (the default key hashes
          # only the root lockfile, so console re-downloads its deps every run).
          cache-dependency-path: |
            package-lock.json
            console/package-lock.json

      - name: Read exact Node cache key component
        id: full-typescript-node
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      # Compiler state only: test outputs, coverage, and dependency trees stay uncached.
      - name: Cache TypeScript incremental state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .local/typescript
          key: typescript-${{ runner.os }}-node${{ steps.full-typescript-node.outputs.version }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'console/package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            typescript-${{ runner.os }}-node${{ steps.full-typescript-node.outputs.version }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'console/package-lock.json', 'tsconfig*.json') }}-

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Host dependency profile (strict)
        run: |
          bash deploy/scripts/install-host-dependencies.sh --profile quality --apply --yes --json > "$RUNNER_TEMP/whatsoup-doctor-quality.json"
          echo "$HOME/.local/share/whatsoup/quality-venv/bin" >> "$GITHUB_PATH"

      - name: Validate strict doctor receipt
        run: |
          set -o pipefail
          bash deploy/scripts/whatsoup-host-doctor.sh --profile quality --json | tee "$RUNNER_TEMP/whatsoup-doctor-quality.json"
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/whatsoup-doctor-quality.json", "utf8")); if (r.profile !== "quality" || r.nodePolicy !== "exact" || r.outcome !== "pass") process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Build Docker deployment image
        timeout-minutes: 10
        run: docker build --file docker/Dockerfile --tag whatsoup-ci .

      - name: Install guard tool dependencies
        run: npm --prefix tools/whatsoup_guard ci

      - name: Guard tool typecheck
        run: npm --prefix tools/whatsoup_guard run typecheck

      - name: Guard tool tests
        run: npm --prefix tools/whatsoup_guard test -- --maxWorkers=2

      - name: Verify Linux policy ownership and controller readability
        timeout-minutes: 2
        run: |
          policy_scratch="$(mktemp -d "$RUNNER_TEMP/policy-contract.XXXXXX")"
          trap 'rm -rf -- "$policy_scratch"' EXIT
          export TMPDIR="$policy_scratch"
          cc -static -Wall -Wextra -Werror tests/runtimes/agent/provider-policy-reader.integration.c -o "$policy_scratch/policy-reader"
          docker run --rm --network none --read-only --user 0:0 \
            --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add FSETID --cap-add SETUID --cap-add SETGID --cap-add KILL \
            --tmpfs /opt/policy-probe:rw,nosuid,noexec,size=16m,mode=0755 \
            --env TMPDIR=/opt/policy-probe \
            --mount "type=bind,src=$PWD/tests/runtimes/agent/provider-policy-permissions.integration.mjs,dst=/policy-probe.mjs,readonly" \
            --mount "type=bind,src=$policy_scratch/policy-reader,dst=/policy-reader,readonly" \
            --entrypoint node whatsoup-ci /policy-probe.mjs /app

      - name: Refresh PR base snapshot
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          fi

      - name: Semantic quality (shadow)
        env:
          SEMANTIC_RECEIPT: ${{ runner.temp }}/semantic-quality.json
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="origin/$GITHUB_BASE_REF"
          else
            base="HEAD^"
          fi
          npm run guard:semantic-quality -- --mode shadow --base "$base" --receipt "$SEMANTIC_RECEIPT"
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';

          const r = JSON.parse(readFileSync(process.env.SEMANTIC_RECEIPT, 'utf8'));
          process.stdout.write(`### Semantic quality (shadow)\n\nDecision: **${r.decision}**\n\nFindings: ${r.findings.length}\n`);
          NODE

      - name: qSesh lint
        run: npm run lint:qsesh

      - name: qSesh tests
        run: npm run test:qsesh

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck scripts/
        run: npm run typecheck:scripts

      - name: Typecheck (all)
        run: npm run typecheck:all

      - name: Import boundary guard
        run: npm run guard:boundaries

      - name: Durability writer invariant guard
        run: npm run guard:durability-writer

      # Backs the three block-severity transport hygiene rules
      # (hygiene.no-wa-jid-literal-in-generic-ui, hygiene.no-whatsapp-copy-in-generic-ui,
      # hygiene.no-health-whatsapp-key-read). Until this step existed they were enforced
      # ONLY by the local pre-push hook: absent from verify:release and from every
      # workflow, so a PR merged through the GitHub UI, `gh pr merge`, `--no-verify`, or a
      # clone without the hook installed could ship a new violation with nothing catching
      # it. The guard ratchets against .claude/fitness/transport-patterns-baseline.json --
      # exit 1 only on NEW violations, so existing baselined debt does not block.
      - name: Transport pattern guard
        run: npm run guard:transport-patterns

      - name: Repo hygiene staged smoke
        run: npm run guard:repo:staged

      - name: Repo hygiene branch diff
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            npm run guard:repo:branch-diff -- --base "origin/$GITHUB_BASE_REF"
          else
            npm run guard:repo:branch-diff
          fi

      - name: Repo hygiene commit-author guard
        run: npm run guard:repo:commit-authors

      # Keep release-only hygiene here so a tag cannot report success before this
      # canonical full validation path has run.
      - name: Release hygiene guard (tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run guard:repo:release-hygiene

      - name: ESLint fitness ring
        run: npm run guard:lint:src

      - name: Tokenomics Python tests
        run: npm run test:tokenomics

      - name: Repo hygiene commit-message smoke
        run: |
          msg="$(mktemp)"
          printf 'chore(ci): guard smoke\n' > "$msg"
          npm run guard:repo:commit-msg -- "$msg"

      # Runs the drift classifier CLI end-to-end against the real tree. Fails ONLY on
      # INCONCLUSIVE — an unrecognised path — never on the drift verdict itself, which is
      # legitimately a "stop" much of the time and would be pure noise as a gate. An
      # unclassified surface means every future verdict touching it silently degrades to
      # "I do not know", which is the failure worth catching at PR time.
      - name: Drift classifier coverage
        run: npm run guard:drift-coverage

      # A committed baseline enumerates tolerated debt, and every other baseline guard
      # compares CURRENT CODE against it — nothing checked the baseline itself, so
      # "add a violation, re-run --update, commit" was green everywhere. This refuses any
      # increase in a baseline's tolerated-debt weight against the merge base.
      #
      # It must be a NAMED CI STEP, not local-only: a guard wired solely into
      # verify:push:branch is bypassed by any server-side merge, which is exactly what
      # tests/scripts/pre-push-guard.test.ts caught when this shipped push-gate-only.
      #
      # Tags have no previous ref; scheduled runs have no event-provided base.
      # Compare their checked-out commit with its parent. The guard records resolved
      # OIDs and rejects identical revisions or a non-ancestor base as inconclusive.
      - name: Baseline growth guard
        env:
          BASELINE_BASE_OID: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || 'HEAD^' }}
        run: npm run guard:baseline-growth -- --base "$BASELINE_BASE_OID" --candidate "$GITHUB_SHA"

      - name: Catch ratchet drift
        run: npm run guard:catch-ratchet

      # `guard:boundaries` checks import DIRECTION; nothing checked for CYCLES. Ships with
      # an EMPTY baseline because src/ measured 433 modules / 1176 runtime edges / 0 cycles
      # — so any cycle reported here is new. Type-only imports are excluded: TypeScript
      # erases them, and counting them is what made an earlier regex prototype report three
      # cycles that do not exist.
      #
      # Named CI step, not push-gate-only: tests/scripts/pre-push-guard.test.ts requires
      # parity, because a local-only guard is bypassed by any server-side merge.
      - name: Import cycle guard
        run: npm run guard:import-cycle

      # A package imported but never declared resolves only because something else hoisted
      # it into node_modules — it works here and breaks on a clean install. Ships with an
      # EMPTY baseline: measured 1972 tracked files / 9818 import sites / 0 phantoms.
      # Declarations resolve PER FILE up the package.json chain, because tools/whatsoup_guard
      # legitimately declares packages the root does not.
      #
      # Named CI step, not push-gate-only: tests/scripts/pre-push-guard.test.ts requires
      # parity for guard:* scripts, since a local-only guard is bypassed by a server-side merge.
      - name: Phantom dependency guard
        run: npm run guard:phantom-deps



      - name: Documentation drift guard
        run: npm run guard:doc-drift

      - name: Design-system hygiene changed files
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            npm run guard:design-system-hygiene -- --changed-since "origin/${GITHUB_BASE_REF}"
          else
            npm run guard:design-system-hygiene -- --changed-since HEAD^
          fi

      - name: Public surface drift guard
        run: npm run guard:public-surface-drift

      - name: Work index coverage guard
        run: npm run guard:work-index

      - name: Claude settings drift guard
        run: npm run guard:claude-settings

      - name: Publication guard
        run: npm run guard:publication:all

      # The push hook's private-literal scan of every commit the branch adds. Run
      # here as well, so a merge that skips the local hook still meets it. It reads
      # GITHUB_BASE_REF for the base; on a push to main the range is empty.
      - name: Publication branch-diff scan
        run: npm run guard:publication:branch-diff

      - name: Node pin consistency guard
        run: npm run guard:node-pin-consistency

      - name: Source runtime drift guard
        run: npm run guard:source-runtime-drift

      - name: BOT ERRORS runtime manifest guard
        run: npm run guard:bot-errors-runtime-manifest

      - name: Fleet bot-hardening parity guard
        run: npm run guard:fleet-bot-hardening-parity
      - name: Observation contract guard
        run: npm run guard:observation-contract

      - name: Simulation matrix guard
        run: npm run guard:bot-errors-simulation-matrix

      - name: BOT ERRORS sentinel coverage and deployer mutation gate
        run: bash deploy/scripts/run-sentinel-tests.sh

      # Directory collection includes deployment qualification; local gates keep
      # its focused command because they do not run this complete Python suite.
      - name: BOT ERRORS full behavioral suite gate
        run: bash deploy/scripts/run-bot-errors-full-suite.sh

      - name: Harness maintenance manifest guard
        run: npm run guard:harness-maintenance

      - name: Fail-closed gate guard
        run: npm run guard:fail-closed-gate

      - name: Service unit validity guard
        run: npm run guard:service-units

      - name: Instance config integrity guard
        run: npm run guard:instance-config

      - name: Insecure tempfile guard
        run: npm run guard:insecure-tempfile

      - name: PNG estate ratchet guard
        run: npm run guard:png-estate

      - name: Zero-byte tracked file guard
        run: npm run guard:zero-byte-tracked

      - name: SQL literal schema guard
        run: npm run guard:sql-schema

      - name: Hardcoded /tmp/ path guard
        run: npm run guard:hardcoded-tmpdir

      - name: Portability platform-patterns guard
        run: npm run guard:platform-patterns


      - name: No destructive git guard
        run: npm run guard:no-destructive-git

      - name: Grant resolver inventory guard
        run: npm run guard:grant-resolver

      - name: Resolved-override inventory guard
        run: npm run guard:resolved-override

      - name: Agent decision polls guard
        run: npm run guard:agent-decision-polls

      - name: Safeguard diagnostics
        run: npm run guard:safeguard-diagnostics

      # These two guards previously ran ONLY in the local .husky/pre-push hook
      # (bypassable via --no-verify / web-UI / hookless clone). Their unit tests
      # run in the suite, but a unit test validates the guard's logic on fixtures
      # — it does NOT run the guard against the real repo, so live arc-binding /
      # critical-surface drift would ship. Run the guards against the tree here
      # (L5-01). Both pass clean on main, so this only catches future drift.
      - name: ARC binding drift guard
        run: npm run guard:arc-binding-drift

      - name: BOT ERRORS critical surface guard
        run: npm run guard:bot-errors-critical-surface

      - name: Secret-leak history scan (advisory)
        continue-on-error: true
        run: npm run guard:repo:scan-history -- 100

      # Console deps must be installed before the root test suite: the design
      # lint gate (tests/console/design-lints.test.ts) builds an ESLint instance
      # from console/eslint.config.shadow.mjs, which resolves its plugins from
      # console/node_modules. Installing after the suite left it absent → the
      # config load threw and the whole 115-case gate failed.
      - name: Install console dependencies
        run: npm --prefix console ci

      # Single full-suite gate. `coverage:check` runs `vitest run --coverage`,
      # which executes the ENTIRE suite (and fails on any test failure) before
      # enforcing thresholds — a strict superset of a plain `vitest run`. The
      # previously-separate "Test suite" step re-ran all ~6651 tests with no
      # coverage, doubling test wall-time per matrix leg for zero added signal.
      #
      # The full-suite battery stops the run at a wall-clock bound (30 min by
      # default, scripts/full-suite-battery.ts). On one head, hosted runs took
      # 1376 s once and exceeded the 1800 s bound twice, with every test file
      # reporting completion, so the default leaves no margin for hosted-runner
      # speed variance. This step raises the bound to 45 min on the hosted
      # runner only; local gates keep the default. 45 min plus the other steps
      # (about 9 min) stays inside the job's 60-minute cap.
      - name: Test suite + coverage thresholds
        env:
          WHATSOUP_FULL_SUITE_BATTERY_TIMEOUT_MS: '2700000'
        run: npm run coverage:check -- --pool=forks

      # Early WARNING (non-blocking): logs when lines/branches/functions coverage is
      # within 2 points above the hard gate (floors = 95/90/93, so it warns below
      # 97/92/95). Reads the coverage-summary.json the step above just produced
      # (json-summary reporter), so it adds no extra suite run. Flags coverage
      # drifting toward the floor before it actually breaches `coverage:check` (the
      # hard gate). Does not fail the build.
      - name: Coverage headroom guard
        run: npm run guard:coverage-headroom

      - name: Failure-scenario drills
        run: npm run test:drills

      - name: Console lint
        run: npm --prefix console run lint

      - name: Console build
        run: npm --prefix console run build

      - name: Console design verification
        # coverage:check above already ran every root design-guard test. Keep
        # the live filesystem checks without rerunning the same 14 test files.
        run: npm run verify:console-design:live

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-node24-
            playwright-${{ runner.os }}-

      # System (apt) deps are installed ONCE, separately from the browser
      # download. Bundling them (`install --with-deps`) meant a timeout-kill of
      # the download left apt/dpkg mid-transaction, so retries fast-failed and
      # never recovered. This step normally finishes in seconds, but a hosted
      # runner has stalled here for more than 10 minutes. Bound it and fail
      # closed; do not retry apt on a runner whose package state may be partial.
      - name: Install Playwright system deps
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Install Playwright chromium
        # The chromium download intermittently hangs on the hosted ubuntu runners
        # (observed repeatedly on the 24.x lane). Bound each attempt with a timeout
        # so a hung attempt is killed and retried, rather than stalling the whole
        # job until the 60-minute cap. Fails only after 3 genuine failures.
        run: |
          TIMEOUT_BIN="$(bash scripts/resolve-timeout-bin.sh)"
          for attempt in 1 2 3; do
            echo "::group::Playwright chromium download attempt ${attempt}/3"
            if "$TIMEOUT_BIN" 300 npx playwright install chromium; then
              echo "::endgroup::"
              echo "Playwright chromium download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            echo "Playwright chromium download attempt ${attempt} failed or timed out; retrying after backoff"
            sleep $((attempt * 15))
          done
          echo "Playwright chromium download failed after 3 attempts"
          exit 1

      - name: Browser test suite
        run: npm run test:browser

      - name: Browser motion test suite
        run: npm run test:browser:motion

      - name: Upload browser test failure screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: browser-test-screenshots-node24
          path: |
            tests/browser/__screenshots__
            tests/browser-motion/__screenshots__
          if-no-files-found: ignore

  compatibility-full:
    name: Quality full (25.x)
    needs: selection
    if: needs.selection.outputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node 25
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '25.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            console/package-lock.json

      - name: Install compatibility host dependencies
        run: |
          bash deploy/scripts/install-host-dependencies.sh --profile quality --node-policy compatibility --apply --yes --json > "$RUNNER_TEMP/whatsoup-host-install-compatibility.json"
          echo "$HOME/.local/share/whatsoup/quality-venv/bin" >> "$GITHUB_PATH"

      - name: Host dependency profile (compatibility-only)
        run: |
          set -o pipefail
          bash deploy/scripts/whatsoup-host-doctor.sh --profile quality --node-policy compatibility --json | tee "$RUNNER_TEMP/whatsoup-doctor-compatibility.json"
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/whatsoup-doctor-compatibility.json", "utf8")); if (r.profile !== "quality" || r.nodePolicy !== "compatibility" || r.outcome !== "compatibility_only") process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Install console dependencies
        run: npm --prefix console ci

      - name: Full compatibility test suite
        run: node --experimental-strip-types scripts/full-suite-battery.ts --pool=forks

      - name: Console compatibility build
        run: npm --prefix console run build

  bot-errors-health-macos:
    needs: selection
    if: needs.selection.outputs.profile == 'full'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: BOT ERRORS macOS health hermeticity
        run: npm run test:bot-errors-health:hermeticity

      - name: Portable Python and release-proof prerequisites (real macOS)
        run: npm test -- tests/helpers/python-interpreter.test.ts tests/scripts/bot-errors-python-atomic-write-guard.test.ts tests/scripts/bot-errors-release-proof-installer.test.ts tests/scripts/bot-errors-release-proof-run.test.ts --pool=forks --maxWorkers=1

      # The credential-probe boundedness suite runs on BOTH legs on purpose. The
      # Linux leg exercises it with timeout(1) present and with PATH stripped to
      # simulate Darwin; this leg runs the same assertions against a real macOS
      # bash and a real `security` binary, so the platform the incident happened
      # on is covered by the platform itself rather than by simulation.
      - name: Credential-probe boundedness (real macOS)
        run: npm run test:credential-probe-boundedness

  # Perf lane (T5 b-12; 19-performance-budget §2). Report-only while the §1
  # numbers await owner sign-off; PERF_LANE_ENFORCE=1 flips it blocking.
  perf-lane:
    needs: selection
    if: needs.selection.outputs.profile == 'full' || (needs.selection.outputs.profile == 'affected' && fromJSON(needs.selection.outputs.lanes).console)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            console/package-lock.json

      - name: Install dependencies
        run: npm ci && npm --prefix console ci

      - name: Build console
        run: npm --prefix console run build

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-node24-
            playwright-${{ runner.os }}-

      - name: Install Playwright system deps
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Install Playwright chromium
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Perf lane (report-only)
        run: npm --prefix console run perf:lane -- --json

  # Keep these two names stable: main branch protection requires them. They
  # aggregate profile-selected work instead of being the costly workers.
  quality:
    name: quality (24.x)
    needs: [selection, docs, affected, full, bot-errors-health-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Fail closed on selected Node 24 validation
        env:
          TEST_JOB_MATRIX: node24
          TEST_PLAN_JSON: ${{ needs.selection.outputs.plan }}
          TEST_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/check-test-jobs.ts

  compatibility:
    name: quality (25.x)
    needs: [selection, docs, compatibility-affected, compatibility-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Fail closed on selected Node 25 validation
        env:
          TEST_JOB_MATRIX: node25
          TEST_PLAN_JSON: ${{ needs.selection.outputs.plan }}
          TEST_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/check-test-jobs.ts
