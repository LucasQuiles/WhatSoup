name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x', '25.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Local dev uses .nvmrc (single version for fast iteration);
      # CI runs a matrix to validate the engines range declared in package.json.
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck scripts/
        run: npm run typecheck:scripts

      - name: Repo hygiene staged smoke
        run: npm run guard:repo:staged

      - name: Repo hygiene commit-message smoke
        run: |
          msg="$(mktemp)"
          printf 'chore(ci): guard smoke\n' > "$msg"
          npm run guard:repo:commit-msg -- "$msg"

      - name: Documentation drift guard
        run: npm run guard:doc-drift

      - name: Work index coverage guard
        run: npm run guard:work-index

      - name: Repo hygiene tests
        run: npm test -- tests/scripts/repo-hygiene-guard.test.ts --pool=forks

      - name: Test suite
        run: npm test -- --pool=forks

      - name: Install console dependencies
        run: npm --prefix console ci

      - name: Console build
        run: npm --prefix console run build
