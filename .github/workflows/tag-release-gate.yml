# Tag release gate
#
# Triggered on any v* tag push. Runs the guard-only subset of verify:release
# that is meaningful at release time and does not require deploy-key secrets
# (test-integrity is gated separately in quality.yml on PRs).
#
# This complements the pre-push hook (scripts/pre-push-guard.ts) which runs
# verify:release locally — but cannot be relied upon for pushes from the
# GitHub UI, gh CLI, or machines without the hook installed.

name: tag-release-gate

on:
  push:
    tags:
      - 'v*'

# Serialize per-tag but NEVER cancel a release mid-flight: a release gate that
# is interrupted can leave a tag half-validated. cancel-in-progress is
# deliberately false here (unlike quality.yml, where superseded PR runs are
# safe to drop).
concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    # Generous cap so only a genuinely hung run is killed; without it a hung
    # run rides to the 6h GitHub default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
          # Cache both the root and console lockfiles so the warm npm cache
          # covers `npm ci` and `npm --prefix console ci` (mirrors quality.yml).
          cache-dependency-path: |
            package-lock.json
            console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python3 -m pip install --user pytest

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (all)
        run: npm run typecheck:all

      - name: Import boundary guard
        run: npm run guard:boundaries

      - name: Repo hygiene release
        run: npm run guard:repo:release-hygiene

      # Tag pushes commonly point at commits already reachable from origin/main,
      # so this keeps guard:repo:commit-authors wired on tag pushes but cannot
      # prove a PR-range author scan by itself.
      # PR and local push gates remain the authoritative non-vacuous author scans.
      - name: Repo commit-authors
        run: npm run guard:repo:commit-authors

      - name: Publication guard (all)
        run: npm run guard:publication:all

      - name: Documentation drift guard
        run: npm run guard:doc-drift

      - name: Public surface drift guard
        run: npm run guard:public-surface-drift

      - name: Work index guard
        run: npm run guard:work-index

      - name: Node pin consistency guard
        run: npm run guard:node-pin-consistency

      - name: Claude settings guard
        run: npm run guard:claude-settings

      - name: Fail-closed gate guard
        run: npm run guard:fail-closed-gate

      - name: Service unit validity guard
        run: npm run guard:service-units

      - name: ESLint fitness ring
        run: npm run guard:lint:src

      - name: Install console dependencies
        run: npm --prefix console ci

      - name: Console lint
        run: npm --prefix console run lint

      - name: Console build
        run: npm --prefix console run build

      - name: Console design verification
        run: npm run verify:console-design

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Browser test suite
        run: npm run test:browser

      - name: Browser motion test suite
        run: npm run test:browser:motion

      - name: Upload browser test failure screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: browser-test-screenshots-tag-release
          path: |
            tests/browser/__screenshots__
            tests/browser-motion/__screenshots__
          if-no-files-found: ignore
