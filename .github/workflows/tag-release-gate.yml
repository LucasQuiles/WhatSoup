# Tag releases are validated by Quality's direct v* trigger. This workflow only
# consumes the bounded receipt from the trusted private scanner after Quality finishes.
name: tag-release-gate

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

# Never cancel a tag validation: a cancelled receipt consumer would leave a pushed
# tag without a final result.
concurrency:
  group: tag-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release-gate:
    if: >-
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # workflow_run runs this workflow from the default branch. Pin that trusted
      # revision rather than resolving a mutable branch or checking out the tag candidate.
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Select authenticated private receipt
        id: select
        env:
          QUALITY_RUN_ID: ${{ github.event.workflow_run.id }}
          QUALITY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          QUALITY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/private-integrity-release.ts select

      - name: Download authenticated private receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          artifact-ids: ${{ steps.select.outputs.artifact-id }}
          run-id: ${{ steps.select.outputs.scanner-run-id }}
          path: ${{ runner.temp }}/private-integrity
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: Verify private integrity receipt
        env:
          QUALITY_RUN_ID: ${{ github.event.workflow_run.id }}
          QUALITY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          QUALITY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          SCANNER_ARTIFACT_ID: ${{ steps.select.outputs.artifact-id }}
          SCANNER_RUN_ID: ${{ steps.select.outputs.scanner-run-id }}
        run: node scripts/private-integrity-release.ts verify --receipt "$RUNNER_TEMP/private-integrity/receipt.json"
