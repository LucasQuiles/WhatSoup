<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B1610" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SOUP Console</title>
    <!-- Theme init: apply persisted theme before first paint to avoid flash.
         Reads whatsoup:theme from localStorage; defaults to dark (tokens-v3 §5). -->
    <script>
      (function() {
        function applyTheme(t) {
          var theme = t === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#FBF6EC' : '#1B1610');
        }
        try {
          applyTheme(localStorage.getItem('whatsoup:theme'));
        } catch (e) {
          applyTheme('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
