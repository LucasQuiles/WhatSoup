# console/eslint-waivers.yaml
#
# Waiver / exception registry for SOUP Design System v3 lint rules.
# Schema (all 7 fields mandatory):
#   id                            unique identifier (WVR-NNN)
#   rule                          soup/* rule or no-restricted-syntax selector group
#   owner                         accountable person/agent handle
#   reason                        technical reason rule cannot be satisfied here
#   scope                         exact files/lines or rule+directory pair
#   expiry                        ISO date; expired waivers fail CI (check 14)
#   replacement_plan              concrete change that retires this waiver
#   safer_alternative_considered  one line: alternative + why rejected
#   status                        temporary | permanent
#   expiration_phase              cutover phase at which this waiver must be re-evaluated
#   cleanup_trigger               concrete event that retires the waiver
#   user_approval_required        yes | no (qa-hardening exception-aging contract)
#
# Lint-plan section 4: no permanent waivers without spec-section citation.
# All suppressions in source must carry "waiver:<id>" tag in their comment.
#
# D6 changes (2026-06-12):
#   WVR-003 RETIRED — zero hex literals remain in chart-utils.ts (grep-verified).
#   WVR-004 RETIRED — QrDisplay hex eliminated via getComputedStyle resolution (7a592488).
#   WVR-002 converted to PERMANENT per spec-section citation (lint-plan §4 third-party numeric API).
# DD-21r changes (2026-06-12):
#   WVR-012 expiration_phase re-pointed: D6→D-series-close (retirement triggers not yet fired).
# B3W4 changes (2026-06-12):
#   WVR-014 RETIRED — static data-line-type accent definitions replace runtime injection (grep-verified; B3 wave 4).
#   WVR-013 RETIRED — .c-kpi-hover shadow migrated to --shadow-hover (raw-color-css 1→0).
# Suppression hygiene (2026-06-14):
#   WVR-015 UPDATED — useExitPresence must clear stale close dwell state on reopen.
# Console transport successor (2026-07-21):
#   WVR-011 RETIRED — generated defaults now update through an exhaustive dependency list while preserving user-authored text.
# Remaining: 9 entries (WVR-001, WVR-002, WVR-005..WVR-009, WVR-012, WVR-015).

waivers:
  - id: WVR-001
    rule: soup/no-untokenized-values
    owner: console-maintainer
    reason: >
      recharts margin prop takes raw SVG pixel offsets, not CSS lengths.
      The <CartesianGrid> and Tooltip accept numeric margin objects;
      CSS variable indirection is not supported by recharts' pre-render
      geometry calculations.
    scope:
      - console/src/lib/chart-utils.ts
    expiry: 2026-12-31
    replacement_plan: >
      Wrap recharts margins in a CHART_MARGIN token adapter at P3.
      The adapter reads CSS var values at runtime (getComputedStyle) and
      returns numeric equivalents, making the token system the SSOT.
    safer_alternative_considered: >
      CSS-var indirection — rejected: recharts reads numbers pre-render
      (before layout), so runtime getComputedStyle is not available.
    status: temporary
    expiration_phase: C3
    cleanup_trigger: chart surface migration slice
    user_approval_required: no

  - id: WVR-002
    rule: soup/no-untokenized-values
    owner: console-maintainer
    reason: >
      QRCode library margin option counts QR cells (integer), not CSS px values.
      The value 2 means "2 QR modules of quiet zone" and cannot be expressed
      as a CSS token. This is a third-party numeric API with no CSS alternative.
    scope:
      - console/src/components/QrDisplay.tsx
    expiry: 2026-12-31
    replacement_plan: >
      No migration path exists. This waiver is permanent per lint-plan section 4
      "third-party numeric API" exception. The QRCode library margin parameter
      is an integer cell count; CSS token indirection is architecturally impossible.
      Re-evaluate only if the library gains CSS-based margin support.
    safer_alternative_considered: >
      none exists — this is a third-party numeric API with no CSS alternative.
      Investigated runtime getComputedStyle shim at D6 — library renders to canvas/SVG
      before CSS layout, so the shim cannot resolve at the required time.
    status: permanent
    expiration_phase: D-series-close
    cleanup_trigger: QRCode library gains CSS margin support (track upstream)
    user_approval_required: no

  - id: WVR-005
    rule: soup/no-infinite-animation
    owner: console-maintainer
    reason: >
      The shimmer animation (console/src/styles/composites.css:510) is used
      for loading skeleton states. Its disposition under the P5 motion strategy
      has not yet been decided: it may be absorbed into the sanctioned ambient
      budget or replaced with a CSS transition. Until the P5 motion.md spec
      lands and disposition is confirmed, the animation holds a waiver.
    scope:
      - console/src/styles/composites.css (shimmer keyframe and animate-shimmer utility)
    expiry: 2026-12-31
    replacement_plan: >
      At P5: either (a) add shimmer to the sanctioned ambient token list with
      a named token per 03-spec/motion.md, or (b) replace with a CSS transition
      on opacity. Either path retires this waiver.
    safer_alternative_considered: >
      Remove immediately — rejected: loading skeletons provide meaningful
      perceived-performance feedback and blank rectangles are worse UX.
    status: temporary
    expiration_phase: C5-motion
    cleanup_trigger: motion-stage skeleton disposition
    user_approval_required: no

  - id: WVR-006
    rule: soup/no-infinite-animation
    owner: console-maintainer
    reason: >
      The typing-bounce animation (console/src/styles/composites.css:108) drives
      the typing indicator dots in chat composers. Like shimmer, its P5
      disposition (sanctioned vs. replaced) has not yet been decided.
    scope:
      - console/src/styles/composites.css (typing-bounce keyframe and .typing-dot)
    expiry: 2026-12-31
    replacement_plan: >
      At P5: either (a) add typing-bounce to the sanctioned ambient budget with
      a named token, or (b) replace with a CSS offset-path or transform sequence.
      Note: the lint-plan calls out typing-bounce explicitly as needing
      "explicit spec disposition at P5".
    safer_alternative_considered: >
      Remove immediately — rejected: typing indicators are a standard chat
      UI affordance and their absence degrades perceived responsiveness.
    status: temporary
    expiration_phase: C5-motion
    cleanup_trigger: motion-stage typing-indicator disposition
    user_approval_required: no

  - id: WVR-007
    rule: no-restricted-syntax (inline-style restriction)
    owner: console-maintainer
    reason: recharts Tooltip contentStyle only accepts an inline style object; className is not supported by the library API.
    scope: console/src/lib/chart-utils.ts:24
    expiry: 2026-12-31
    replacement_plan: chart theming consolidates into the Card/Chart primitive at C2/C3; revisit recharts wrapper there.
    safer_alternative_considered: CSS class injection via wrapperClassName — rejected, recharts applies contentStyle after class styles.
    status: temporary
    expiration_phase: C3
    cleanup_trigger: chart surface migration slice
    user_approval_required: no
  - id: WVR-008
    rule: react-refresh/only-export-components
    owner: console-maintainer
    reason: provider + hook co-located by design; HMR limitation only.
    scope: console/src/hooks/use-websocket.tsx:1
    expiry: 2026-12-31
    replacement_plan: split provider/hook files if the module is next edited substantively.
    safer_alternative_considered: file split now — rejected as unrelated-refactor under the single-concern rule.
    status: temporary
    expiration_phase: C4
    cleanup_trigger: next substantive edit to use-websocket.tsx
    user_approval_required: no
  - id: WVR-009
    rule: react-hooks/incompatible-library
    owner: console-maintainer
    reason: "@tanstack/react-virtual useVirtualizer trips the compiler heuristic; library hook is stable and supported."
    scope: console/src/hooks/use-virtual-messages.ts:63
    expiry: 2026-12-31
    replacement_plan: remove when react-hooks lint adds first-party support for tanstack virtual.
    safer_alternative_considered: rewriting virtualization in-house — rejected, regression risk.
    status: temporary
    expiration_phase: C4
    cleanup_trigger: react-hooks plugin/library compatibility update
    user_approval_required: no
  - id: WVR-012
    rule: react-refresh/only-export-components
    owner: console-maintainer
    reason: popoverOptionId + usePopoverKeyboard are co-located with Popover — the three are one combobox aria contract; splitting creates a spec-orphan module (same HMR-only limitation as WVR-008).
    scope: console/src/components/primitives/Popover.tsx
    expiry: 2026-12-31
    replacement_plan: >
      Re-evaluated at D6 (2026-06-12): neither retirement trigger has occurred —
      react-refresh has not gained mixed-export support and the helpers have no
      second consumer. Next review: D-series close or C4.
      Retire if react-refresh capability changes or helper extraction happens.
    safer_alternative_considered: separate popover-keyboard.ts module — rejected as spec-orphan fragmentation.
    status: temporary
    expiration_phase: D-series-close
    cleanup_trigger: react-refresh gains mixed-export support or helpers gain a second consumer
    user_approval_required: no
  - id: WVR-015
    rule: react-hooks/set-state-in-effect
    owner: console-maintainer
    reason: >
      On re-open, useExitPresence must clear the stale closingActive dwell bit
      after the prior close cleanup cancels callbacks, or the next zero-duration
      close can remain mounted.
    scope: console/src/hooks/use-exit-presence.ts:93
    expiry: 2026-12-31
    replacement_plan: >
      Revisit during the modal/drawer presence-machine cleanup; retire if the exit
      animation contract moves to a reducer/primitive that can represent closing
      and reopen cancellation without effect-state reset writes.
    safer_alternative_considered: >
      Leaving stale closingActive until a later close is rejected because instant-path
      closes would keep the shell mounted.
    status: temporary
    expiration_phase: D-series-close
    cleanup_trigger: modal/drawer presence primitive rewrite or React hook guidance change
    user_approval_required: no
